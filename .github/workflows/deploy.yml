
name: Deploy SKA Adventure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Compare player and animation bind poses
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          function read(path){const b=fs.readFileSync(path),n=b.readUInt32LE(12);return JSON.parse(b.toString('utf8',20,20+n).trim());}
          const model=read('src/Business_Female_02.glb'),walk=read('src/f_walk_neutral_01.glb'),idle=read('src/f_idle_neutral_01.glb');
          const byName=nodes=>new Map((nodes||[]).filter(n=>n.name).map(n=>[n.name,n]));
          const mn=byName(model.nodes);
          const targets=[...mn.keys()].filter(n=>/Bip01$|Bip01 (Pelvis|Spine|L Thigh|R Thigh|L Calf|R Calf|L Foot|R Foot|L UpperArm|R UpperArm)/.test(n));
          function diff(a,b){a=a||[0,0,0,1];b=b||[0,0,0,1];const dot=Math.abs(a.reduce((s,x,i)=>s+x*b[i],0));return 2*Math.acos(Math.min(1,dot))*180/Math.PI;}
          for(const [label,clip] of [['WALK',walk],['IDLE',idle]]){
            const cn=byName(clip.nodes);
            console.log('BIND_POSE_COMPARE',label);
            for(const name of targets){const a=mn.get(name),b=cn.get(name);if(!b)continue;console.log(name,'ANGLE_DIFF',diff(a.rotation,b.rotation).toFixed(2),'MODEL',JSON.stringify(a.rotation||[0,0,0,1]),'ANIMATION',JSON.stringify(b.rotation||[0,0,0,1]));}
          }
          NODE
      - name: Build game
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4
        
